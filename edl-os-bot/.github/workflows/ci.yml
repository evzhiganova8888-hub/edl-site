name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edl
          POSTGRES_PASSWORD: edl
          POSTGRES_DB: edl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://edl:edl@localhost:5432/edl_test
      SYNC_DATABASE_URL: postgresql+psycopg://edl:edl@localhost:5432/edl_test
      REDIS_URL: redis://localhost:6379/0
      BOT_TOKEN: "0:test"
      ANTHROPIC_API_KEY: "test-key"
      PAYMENT_MODE: stub
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q --tb=short
