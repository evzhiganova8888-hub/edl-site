services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edl
      POSTGRES_PASSWORD: edl
      POSTGRES_DB: edl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edl"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  celery:
    build: .
    env_file: .env
    command: celery -A src.tasks.celery_app worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  celery-beat:
    build: .
    env_file: .env
    command: celery -A src.tasks.celery_app beat -l info
    depends_on:
      - redis
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
