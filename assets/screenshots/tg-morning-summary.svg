<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-label="Утренняя Telegram-сводка от EDL OS Bot">
  <defs>
    <filter id="tg1-shadow"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0000001a"/></filter>
  </defs>
  <!-- Phone frame -->
  <rect x="8" y="8" width="384" height="544" rx="22" fill="#f0f2f5" filter="url(#tg1-shadow)"/>

  <!-- Header -->
  <rect x="8" y="8" width="384" height="60" rx="22" fill="#ffffff"/>
  <rect x="8" y="36" width="384" height="32" fill="#ffffff"/>
  <circle cx="50" cy="38" r="18" fill="#FF6B1A"/>
  <text x="50" y="43" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">E</text>
  <text x="78" y="34" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">EDL OS Bot</text>
  <circle cx="78" cy="48" r="3.5" fill="#10b981"/>
  <text x="86" y="51" font-family="Inter,Arial,sans-serif" font-size="11" fill="#10b981">онлайн</text>
  <line x1="8" y1="68" x2="392" y2="68" stroke="#e4e4e7"/>

  <!-- Date pill -->
  <rect x="146" y="82" width="108" height="22" rx="11" fill="#e4e4e7"/>
  <text x="200" y="97" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">19 мая · 08:00</text>

  <!-- Bubble: greeting -->
  <rect x="24" y="114" width="220" height="36" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <text x="36" y="136" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1f2937">Доброе утро. Сводка за вчера:</text>

  <!-- Bubble 1: margin -->
  <rect x="24" y="162" width="352" height="64" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <text x="36" y="182" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1f2937">📊 <tspan font-weight="700">Маржа мая:</tspan> <tspan font-weight="700" fill="#ef4444">−2,1 п.п.</tspan> к плану</text>
  <text x="36" y="200" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Главный вклад: клиент Z (−8% маржа)</text>
  <text x="36" y="218" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">08:00</text>

  <!-- Bubble 2: cash -->
  <rect x="24" y="238" width="352" height="56" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <text x="36" y="258" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1f2937">💰 <tspan font-weight="700">Касса:</tspan> <tspan font-weight="700" fill="#10b981">+1,2 М</tspan> за неделю</text>
  <text x="36" y="276" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Дебиторка Завод X — 1,5 М, 40 дней</text>
  <text x="36" y="288" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">08:00</text>

  <!-- Bubble 3: hot -->
  <rect x="24" y="306" width="352" height="60" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <text x="36" y="326" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1f2937">🔥 <tspan font-weight="700">3 HOT-сделки</tspan> требуют ответа сегодня</text>
  <text x="36" y="344" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Петров (1,2 М), Стройбаза (800к), Альфа (450к)</text>
  <text x="36" y="358" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">08:00</text>

  <!-- Bubble 4: VAT -->
  <rect x="24" y="378" width="352" height="60" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <text x="36" y="398" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1f2937">⚖️ <tspan font-weight="700">НДС 2026:</tspan> 2 контракта на грани УСН</text>
  <text x="36" y="416" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6b7280">Решение нужно до 1 июля. Карта — в PDF.</text>
  <text x="36" y="430" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">08:00</text>

  <!-- Inline button -->
  <rect x="24" y="454" width="160" height="36" rx="10" fill="#FF6B1A"/>
  <text x="104" y="477" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">📎 Открыть PDF-чекап</text>

  <!-- Input bar -->
  <rect x="24" y="510" width="352" height="32" rx="16" fill="#fff" stroke="#e4e4e7"/>
  <text x="40" y="530" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9ca3af">Спросите что-то про сводку…</text>
</svg>
