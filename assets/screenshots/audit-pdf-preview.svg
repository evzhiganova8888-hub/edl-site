<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-label="Превью PDF Бизнес-чекапа">
  <defs>
    <filter id="pdf-shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0000001a"/></filter>
  </defs>
  <!-- Paper -->
  <rect x="8" y="8" width="384" height="544" rx="6" fill="#ffffff" stroke="#e5e7eb" filter="url(#pdf-shadow)"/>
  <!-- Tangerine header -->
  <rect x="8" y="8" width="384" height="56" rx="6" fill="#FF6B1A"/>
  <rect x="8" y="36" width="384" height="28" fill="#FF6B1A"/>
  <text x="24" y="32" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" fill="#ffe8d4" letter-spacing="1">EDL OS · БИЗНЕС-ЧЕКАП</text>
  <text x="24" y="52" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Founder OS · 4 слоя · 20 вопросов</text>

  <!-- Client block -->
  <text x="24" y="92" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9ca3af" letter-spacing="0.5">КЛИЕНТ</text>
  <text x="24" y="112" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">ООО Стройбаза · услуги B2B · 35 человек</text>
  <text x="24" y="128" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6b7280">Чекап Plus · 19 мая 2026 · версия методологии 4.2</text>

  <!-- Divider -->
  <line x1="24" y1="146" x2="376" y2="146" stroke="#e5e7eb"/>

  <!-- Section title -->
  <text x="24" y="172" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827">Резюме по 4 слоям Founder OS</text>

  <!-- 4-quadrant cards -->
  <g font-family="Inter,Arial,sans-serif">
    <!-- Стратегия -->
    <rect x="24" y="184" width="170" height="76" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="36" y="204" font-size="10" fill="#6b7280" letter-spacing="0.5">СТРАТЕГИЯ</text>
    <text x="36" y="226" font-size="22" font-weight="700" fill="#10b981">7,2</text>
    <text x="78" y="226" font-size="11" fill="#6b7280">/10</text>
    <text x="36" y="248" font-size="11" fill="#374151">3 ставки на квартал</text>
    <!-- Воронка -->
    <rect x="206" y="184" width="170" height="76" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="218" y="204" font-size="10" fill="#6b7280" letter-spacing="0.5">ВОРОНКА</text>
    <text x="218" y="226" font-size="22" font-weight="700" fill="#f59e0b">5,4</text>
    <text x="260" y="226" font-size="11" fill="#6b7280">/10</text>
    <text x="218" y="248" font-size="11" fill="#374151">HOT без касания 24ч</text>
    <!-- Операционка -->
    <rect x="24" y="268" width="170" height="76" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="36" y="288" font-size="10" fill="#6b7280" letter-spacing="0.5">ОПЕРАЦИОНКА</text>
    <text x="36" y="310" font-size="22" font-weight="700" fill="#10b981">6,8</text>
    <text x="78" y="310" font-size="11" fill="#6b7280">/10</text>
    <text x="36" y="332" font-size="11" fill="#374151">Загрузка ровная</text>
    <!-- Деньги -->
    <rect x="206" y="268" width="170" height="76" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="218" y="288" font-size="10" fill="#6b7280" letter-spacing="0.5">ДЕНЬГИ</text>
    <text x="218" y="310" font-size="22" font-weight="700" fill="#ef4444">4,1</text>
    <text x="260" y="310" font-size="11" fill="#6b7280">/10</text>
    <text x="218" y="332" font-size="11" fill="#374151">Маржа -2,1 п.п.</text>
  </g>

  <!-- VAT flag warning -->
  <rect x="24" y="364" width="352" height="60" rx="8" fill="#FFF5EE" stroke="#FF6B1A" stroke-width="1.5"/>
  <text x="40" y="386" font-family="Inter,Arial,sans-serif" font-size="14">⚠️</text>
  <text x="64" y="386" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#9a3412">НДС-флажок 2026</text>
  <text x="40" y="406" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7c2d12">2 контракта в зоне риска УСН → +180 000 ₽ к плану налогов.</text>
  <text x="40" y="420" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7c2d12">Карта контрактов и сценарии — стр. 7.</text>

  <!-- Recommendations preview -->
  <text x="24" y="450" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#111827">7 ключевых рекомендаций</text>
  <text x="24" y="472" font-family="Inter,Arial,sans-serif" font-size="11" fill="#374151">1. Пересмотр условий по клиенту Z (маржа -8% против +18%)</text>
  <text x="24" y="490" font-family="Inter,Arial,sans-serif" font-size="11" fill="#374151">2. Регламент касания HOT &lt; 24 ч (потеря ~1,8 М/мес)</text>
  <text x="24" y="508" font-family="Inter,Arial,sans-serif" font-size="11" fill="#374151">3. Решение по 2 контрактам в зоне НДС до 1.07</text>
  <text x="24" y="526" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9ca3af">… ещё 4 на стр. 9</text>

  <!-- Footer -->
  <text x="24" y="546" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9ca3af">стр. 1 из 15 · Plus · подготовлено @edl_os_bot</text>
</svg>
