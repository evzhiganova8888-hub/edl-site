<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-label="Карта НДС 2026 по 5 контрактам">
  <defs>
    <filter id="vat-shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0000001a"/></filter>
