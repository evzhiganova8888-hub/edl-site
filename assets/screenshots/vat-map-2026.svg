  <text x="24" y="498" font-family="Inter,Arial,sans-serif" font-size="11" fill="#374151">• или дробление по реальному функционалу</text>

  <!-- Source line -->
  <line x1="24" y1="516" x2="376" y2="516" stroke="#f3f4f6"/>
  <text x="24" y="534" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9ca3af">Источник: ваши данные из 1С (read-only) · обновлено сегодня в 08:00</text>
